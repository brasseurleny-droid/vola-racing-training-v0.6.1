name: Build APK

# Lancement MANUEL uniquement (onglet Actions > Build APK > Run workflow),
# pour ne pas consommer de minutes a chaque envoi de fichiers.
on:
  workflow_dispatch:

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      # Un seul appel Gradle : tests + APK. --continue : l'APK est produit meme si un test echoue.
      - name: Tests et APK debug
        run: gradle test assembleDebug --continue --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rapports-tests
          path: app/build/reports/tests/
          if-no-files-found: ignore
